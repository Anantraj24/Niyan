services:
  niyamx:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: niyamx-workbench
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - NIYAM_HOME=/app/.niyam
    volumes:
      - niyam_data:/app/.niyam

volumes:
  niyam_data:
    driver: local
